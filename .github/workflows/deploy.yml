name: Implantar na Produção (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Confira o código
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            cd /home/ubuntu/apps/Sistema-Web-de-Livros

            # 1. Configurar rede do Git para evitar timeouts
            git config force.ipversion 4
            git pull origin main

            # 2. Reconstruir e subir os containers leves
            docker compose up -d --build

            # 3. Executar migrações e caches do Laravel
            docker compose exec -T app php artisan migrate --force || true
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
