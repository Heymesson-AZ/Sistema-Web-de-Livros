name: Implantar na Produção (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Confira o código
        uses: actions/checkout@v4

      - name: Implantação do executável via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd /home/ubuntu/apps/Sistema-Web-de-Livros

            # Força IPv4 no servidor
            git config force.ipversion 4

            # Atualiza o código
            git pull origin main

            # Reconstrói e sobe o container Docker
            docker compose up -d --build

            # Otimizações e migrações do Laravel
            docker compose exec -T app php artisan migrate --force || true
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
