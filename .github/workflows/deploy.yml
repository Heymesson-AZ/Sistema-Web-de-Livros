name: Implantar na Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Confira o código
        uses: actions/checkout@v4

      - name: Implantação do executável via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/apps/Sistema-Web-de-Livros

            # 1. Atualiza o código primeiro
            git pull origin main

            # 2. Instala dependências ignorando a checagem rigorosa de versão do PHP
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

            # 3. Executa as tarefas do Laravel
            php artisan down --retry=60 || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
