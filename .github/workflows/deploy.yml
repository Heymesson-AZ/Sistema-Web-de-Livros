name: Implantar na Produção (Docker)

on:
  push:
    branches:
      - main # O deploy só acontece quando você mandar código para a main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Confira o código
        uses: actions/checkout@v4

      # 1. Instalar Node.js para compilar o front-end automaticamente no GitHub
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências e compilar o Front-end (Vite)
        run: |
          npm install
          npm run build

      # 2. Executar o Deploy via SSH na VPS nova
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            cd /home/ubuntu/apps/Sistema-Web-de-Livros

            # 1. Configurar rede do Git para evitar timeouts
            git config force.ipversion 4
            git pull origin main

            # 2. Reconstruir e subir os containers leves (já pegando o front-end compilado)
            docker compose up -d --build

            # 3. Executar migrações e caches do Laravel
            docker compose exec -T -u 0 app php artisan migrate --force || true
            docker compose exec -T -u 0 app php artisan config:cache
            docker compose exec -T -u 0 app php artisan route:cache
            docker compose exec -T -u 0 app php artisan view:cache
