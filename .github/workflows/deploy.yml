name: Implantar na Produção (Docker)

on:
  push:
    branches:
      - main # O deploy só acontece quando você mandar código para a main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Confira o código
        uses: actions/checkout@v4

      # 1. Instalar Node.js para compilar o front-end automaticamente no GitHub
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências e compilar o Front-end (Vite)
        run: |
          npm install
          npm run build

      # 2. Executar o Deploy via SSH na VPS
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 20m

          # Tudo isso em uma esteira contínua (pipeline).
          script: |
            cd /home/ubuntu/apps/Sistema-Web-de-Livros

            # 1. Configurar rede do Git para evitar timeouts
            git config force.ipversion 4
            git pull origin main

            # 2. Garantir configurações de e-mail e locale no .env da VPS

            touch .env
            grep -q "^APP_LOCALE=" .env && sed -i 's/^APP_LOCALE=.*/APP_LOCALE=pt_BR/' .env || echo "APP_LOCALE=pt_BR" >> .env

            grep -q "^APP_FALLBACK_LOCALE=" .env && sed -i 's/^APP_FALLBACK_LOCALE=.*/APP_FALLBACK_LOCALE=pt_BR/' .env || echo "APP_FALLBACK_LOCALE=pt_BR" >> .env

            grep -q "^APP_FAKER_LOCALE=" .env && sed -i 's/^APP_FAKER_LOCALE=.*/APP_FAKER_LOCALE=pt_BR/' .env || echo "APP_FAKER_LOCALE=pt_BR" >> .env

            grep -q "^MAIL_MAILER=" .env && sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=smtp/' .env || echo "MAIL_MAILER=smtp" >> .env

            grep -q "^MAIL_HOST=" .env && sed -i 's/^MAIL_HOST=.*/MAIL_HOST=smtp.gmail.com/' .env || echo "MAIL_HOST=smtp.gmail.com" >> .env

            grep -q "^MAIL_PORT=" .env && sed -i 's/^MAIL_PORT=.*/MAIL_PORT=587/' .env || echo "MAIL_PORT=587" >> .env

            grep -q "^MAIL_USERNAME=" .env && sed -i 's/^MAIL_USERNAME=.*/MAIL_USERNAME=universopapel.notification@gmail.com/' .env || echo "MAIL_USERNAME=universopapel.notification@gmail.com" >> .env

            grep -q "^MAIL_PASSWORD=" .env && sed -i 's/^MAIL_PASSWORD=.*/MAIL_PASSWORD=czvjxyykmekvyokq/' .env || echo "MAIL_PASSWORD=czvjxyykmekvyokq" >> .env

            grep -q "^MAIL_FROM_ADDRESS=" .env && sed -i 's/^MAIL_FROM_ADDRESS=.*/MAIL_FROM_ADDRESS="universopapel.notification@gmail.com"/' .env || echo 'MAIL_FROM_ADDRESS="universopapel.notification@gmail.com"' >> .env
            
            grep -q "^MAIL_FROM_NAME=" .env && sed -i 's/^MAIL_FROM_NAME=.*/MAIL_FROM_NAME="Universo de Papel"/' .env || echo 'MAIL_FROM_NAME="Universo de Papel"' >> .env

            # 3. Reconstruir e subir os containers leves (já pegando o front-end compilado)
            docker compose up -d --build

            # 4. Executar migrações e caches do Laravel
            docker compose exec -T -u 0 app php artisan storage:link || true
            docker compose exec -T -u 0 app php artisan migrate --force || true
            docker compose exec -T -u 0 app php artisan config:cache
            docker compose exec -T -u 0 app php artisan route:cache
            docker compose exec -T -u 0 app php artisan view:clear

# Finalidade: Automatizar a publicação do seu sistema diretamente na sua
# VPS da Oracle Cloud, sem que você precise acessar o servidor manualmente.

# O que ele faz: Assim que o código vai para a branch principal (main),
#  ele se conecta à sua VPS de forma segura via SSH, baixa a versão mais
# atualizada do código, reconstrói os containers do Docker e executa os comandos essenciais do Laravel
# (como migrações de banco de dados e limpeza de cache) para o site atualizar no ar na mesma hora.
