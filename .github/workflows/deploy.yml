name: Implantar na Produção (Docker Otimizado)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Confira o código
        uses: actions/checkout@v4

      # --- BLOCO 1: COMPILAR FRONT-END NO GITHUB (RÁPIDO) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências e Compilar Assets (Vite)
        run: |
          npm install
          npm run build # Isso gera a pasta public/build ou public/dist

      # --- BLOCO 2: ENVIAR ARQUIVOS PRONTOS PARA A VPS ---
      - name: Sincronizar arquivos via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "."
          target: "/home/ubuntu/apps/Sistema-Web-de-Livros"
          overwrite: true

      # --- BLOCO 3: COMANDOS DOCKER NA VPS (AGORA LEVE) ---
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 10m # 10 minutos agora é mais que suficiente
          script: |
            cd /home/ubuntu/apps/Sistema-Web-de-Livros

            # Reconstrói o container (apenas PHP/Nginx, sem npm install inside)
            docker compose up -d --build

            # Comandos Laravel
            docker compose exec -T app php artisan migrate --force || true
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
